<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 Year Countdown</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#000;color:#fff;
  font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center}
  main{text-align:center;width:min(900px,92vw);padding:40px 20px}
  .status{font-size:12px;letter-spacing:4px;text-transform:uppercase;opacity:.45;margin-bottom:35px}
  #timer{font-size:clamp(42px,9vw,92px);font-weight:300;letter-spacing:2px;font-variant-numeric:tabular-nums}
  .labels{display:flex;justify-content:center;gap:clamp(25px,6vw,70px);margin-top:12px;
  font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.4}
  .battery-wrap{margin:55px auto 0;width:min(620px,88vw)}
  .battery{height:48px;border:2px solid #fff;border-radius:7px;padding:4px;position:relative}
  .battery:after{content:"";position:absolute;right:-9px;top:13px;width:6px;height:18px;background:#fff;border-radius:0 3px 3px 0}
  #fill{height:100%;width:0%;background:#fff;border-radius:2px;transition:width .5s linear}
  #percent{margin-top:18px;font-size:18px;letter-spacing:3px;font-variant-numeric:tabular-nums}
  #sub{margin-top:12px;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.4}
  #dates{margin-top:45px;font-size:12px;letter-spacing:2px;opacity:.35}
</style>
</head>
<body>
<main>
  <div class="status" id="status">Countdown begins September 24, 2026</div>
  <div id="timer">1095 : 00 : 00 : 00</div>
  <div class="labels"><span>Days</span><span>Hours</span><span>Minutes</span><span>Seconds</span></div>
  <div class="battery-wrap">
    <div class="battery"><div id="fill"></div></div>
    <div id="percent">0.0000%</div>
    <div id="sub">Time remaining: 100.0000%</div>
  </div>
  <div id="dates">24 September 2026 — 24 September 2029</div>
</main>
<script>
(() => {
  // Uses the viewer's local timezone. The countdown starts at local midnight
  // on September 24, 2026 and ends at local midnight on September 24, 2029.
  const start = new Date(2026, 8, 24, 0, 0, 0, 0).getTime();
  const end   = new Date(2029, 8, 24, 0, 0, 0, 0).getTime();
  const total = end - start;
  const timer = document.getElementById('timer');
  const fill = document.getElementById('fill');
  const percent = document.getElementById('percent');
  const sub = document.getElementById('sub');
  const status = document.getElementById('status');

  function update(){
    const now = Date.now();
    if(now < start){
      const until = start - now;
      const d=Math.floor(until/86400000), h=Math.floor(until%86400000/3600000);
      const m=Math.floor(until%3600000/60000), s=Math.floor(until%60000/1000);
      timer.textContent=`${String(d).padStart(4,'0')} : ${String(h).padStart(2,'0')} : ${String(m).padStart(2,'0')} : ${String(s).padStart(2,'0')}`;
      fill.style.width='0%'; percent.textContent='0.0000%';
      sub.textContent='Waiting to begin';
      status.textContent='Countdown begins September 24, 2026';
      return;
    }
    if(now >= end){
      timer.textContent='0000 : 00 : 00 : 00';
      fill.style.width='100%'; percent.textContent='100.0000%';
      sub.textContent='Time remaining: 0.0000%';
      status.textContent='Three years complete';
      return;
    }
    const elapsed=now-start, remaining=end-now;
    const d=Math.floor(remaining/86400000), h=Math.floor(remaining%86400000/3600000);
    const m=Math.floor(remaining%3600000/60000), s=Math.floor(remaining%60000/1000);
    const p=elapsed/total*100;
    timer.textContent=`${String(d).padStart(4,'0')} : ${String(h).padStart(2,'0')} : ${String(m).padStart(2,'0')} : ${String(s).padStart(2,'0')}`;
    fill.style.width=p+'%';
    percent.textContent=p.toFixed(4)+'%';
    sub.textContent='Time remaining: '+(100-p).toFixed(4)+'%';
    status.textContent='Time remaining until September 24, 2029';
  }
  update();
  setInterval(update,1000);
})();
</script>
</body>
</html>
